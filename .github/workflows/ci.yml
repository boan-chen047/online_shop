name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 讀 package.json 的 packageManager 欄位（pnpm@10.28.2）安裝對應版本 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm build = vue-tsc -b（型別檢查）+ vite build（建置）
      - name: Type-check and build
        run: pnpm build

  # build 綠燈後才部署正式環境（Vercel 對 master 的自動部署已於 vercel.json 關閉，避免重複）
  deploy:
    name: Deploy production (Vercel)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_tUkwq8toTCIbHVJzhVEhPMX4
      VERCEL_PROJECT_ID: prj_FSkxWKcjIF9T2nyLY41yCRZAhKFd
      VERCEL_TOKEN: ${{ secrets.ONLINE_SHOP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 診斷：印出這把 token 認不認得出使用者（若這步失敗＝token 無效）
      - name: Whoami (token check)
        run: vercel whoami --token="$VERCEL_TOKEN"

      # 直接寫入 .vercel/project.json 完成連結（繞過 vercel pull）
      - name: Link project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Build with Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
